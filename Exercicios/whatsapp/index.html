<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whatsapp</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <style>
        body{
            background-image:image(background-image);
        }
    </style>

    <div style="display: flex;">
        <div class="header">
            <button><img src="./images/image_logo.png" class="logo-header" alt=""></button>

            <button><i class="bi bi-chat-left-dots-fill icon-header"></i></button>

            <button><i class="bi bi-people-fill icon-header"></i></button>
                
            <button><i class="bi bi-compass-fill icon-header"></i></button>

            <button><i class="bi bi-telephone-fill icon-header"></i></button>

            <button><i class="bi bi-gear-fill icon-header"></i></button>

            <button style="padding-top: 70px;"><i class="bi bi-person-circle icon-header"></i></button>
        </div>

        <div class="messages">
            <div style="display: flex; gap: 10px;">
                <div style="font-weight: 700; font-size: 25px;">Conversas</div>

                <div style="padding-left: 30px;"></div>

                <button><i class="bi bi-search icons-messages"></i></button>

                <button><i class="bi bi-pencil-square icons-messages"></i></button>

                <button><i class="bi bi-three-dots-vertical icons-messages"></i></button>
            </div>
            <div>
                <i class="bi bi-search" style=" position: absolute; padding-left: 10px;padding-top: 10px ; z-index: 2;"></i>
                <input type="text" placeholder="Pesquisar ou começar uma conversa" class="search-message">
            </div>
            <a href="#">
                <div class="chats-interface">
                    <img src="./images/image-family.png" class="chats" alt="">

                    <div>
                        <div class="chat-name">Grupo Senac</div>
                        <div class="chat-message">Até a próxima aula!</div>
                    </div>

                    <div class="left-message">
                        <div class="chat-hour"> 15:42</div>
                        <i class="bi bi-3-circle-fill chat-notification"></i>
                    </div>

                </div>
            </a>

            <a href="#">
                <div class="chats-interface">

                    <img src="./images/image-pic-hollow.png" class="chats" alt="">

                    <div>
                        <div class="chat-name">Pedro</div>
                        <div class="chat-message">Entra no lol!</div>
                    </div>
                    
                    <div class="left-message">
                        <div class="chat-hour"> 21:42</div>
                        <i class="bi bi-1-circle-fill chat-notification"></i>
                    </div>

                </div>
            </a>

            <a href="#">
                <div class="chats-interface">
                    <img src="./images/image-teacher.png" class="chats" alt="">
                    <div>
                        <div class="chat-name">Professor</div>
                        <div class="chat-message">Criem o Whatsapp 2</div>
                    </div>
                    
                    <div class="left-message">
                        <div class="chat-hour"> 19:42</div>
                        <i class="bi bi-1-circle-fill chat-notification"></i>
                    </div>
                </div>
            </a>

        
        </div>
        <div style="width: 100%; display: flex; flex-direction: column;">
            <header class="background-message">
                <div style="display: flex;">
                    <div>   
                        <img src="./images/image-family.png" class="chats" alt="">
                    </div>
                    <div class="background-title">

                        <div class="title-message">
                            Familia 
                        </div>
                        <div class="subtitle-message">
                            3 membros
                        </div>

                    </div>

                    <div style="display: flex; gap: 15px; align-items: center;">
                        <i class="bi bi-camera-video icons-messages"></i>
                        <i class="bi bi-telephone icons-messages"></i>
                        <i class="bi bi-three-dots-vertical icons-messages"></i>
                    </div>
                    
                </div>
            </header>

            <div class="my-message">

                <div class="my-text-message">
                    OI PESSOAL!👋
                </div>
                <div class="my-text-message">
                    Tudo bem?
                </div>
                
            </div>
            <div style="display: flex; flex-direction: column; row-gap: 10px; padding-left: 10px;">
                <img src="./images/image-teacher.png" class="chats" alt="">
                <div class="other-message">
                    <div class="other-text-message">
                        <div class="name">
                            Professor
                        </div>
                        <div>
                            Tudo sim! E você?
                        </div>
                    </div>
                </div>

                <img src="./images/image-photo.png" class="chats" alt="">
                <div class="other-message">
                    <div class="other-text-message">
                        <div class="name">
                            João
                        </div>
                        <div>
                            Amanhã não tem aula!
                        </div>
                    </div>
                </div>

            </div>


            <div style="display: flex; position: fixed; bottom: 4px;">
                
                <i class="bi-emoji-smile" style=" position: absolute; padding-left: 10px;padding-top: 10px; z-index: 2; color: white;"></i>
                <input type="text" placeholder="Digite uma mensagem" class="send-message padding-left: 30px">

                <div style="display: flex; gap: 35px; position: absolute; padding-left: 700px;padding-top:5px;">
                    <div>
                        <i class="bi bi-paperclip icon-inputs"></i>
                    </div>
                    <div>
                        <i class="bi bi-camera-video icon-inputs"></i>
                    </div>
                </div>

                <div style="padding-left: 10px;">
                    <i class="bi bi-mic-fill icon-inputs" style="background-color: #03E18C; border-radius: 20px; width: 30px; height: 30px; padding: 5px;"></i>
                </div>
                
            </div>

        </div>
        
    </div>
       
</body>
</html>
