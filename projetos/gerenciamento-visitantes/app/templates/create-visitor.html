{% extends 'base.html' %}

{% block title %}
Criar visitante
{% endblock %}

{% block content %}

    <div>
        <h1>Criar novo visitante</h1>
        <p>Use o formulário abaixo para criar um novo visitante</p>

        <form action="./" method="post">
            {% csrf_token %}
            <label for="first_name" class="form-label">Primeiro nome</label>
            <input type="text" class="form-control" id="first_name" name="first_name">
            
            <label for="last_name" class="form-label">Último nome</label>
            <input type="text" class="form-control" id="last_name" name="last_name">
            
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" class="form-control" id="cpf" name="cpf">
            
            <label for="birth_date" class="form-label">Data de nascimento</label>
            <input type="date" class="form-control" id="birth_date" name="birth_date">
            
            <label for="ticket_date" class="form-label">Data do ingresso</label>
            <input type="date" class="form-control" id="ticket_date" name="ticket_date">

            <label for="ticket_type" class="form-label">Tipo do ingresso</label>
            <select name="ticket_type" id="ticket_type" class="form-select">
                <option value="1">Normal</option>
                <option value="2">VIP</option>
                <option value="3">Premium</option>
            </select>

            <input type="submit" value="Salvar" class="btn btn-success mt-3">
        </form>

        <a href="../" class="btn btn-outline-primary mt-3">Voltar</a>
    </div>
{% endblock %}
