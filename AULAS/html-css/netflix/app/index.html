<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">

    <title>Netflix</title>
</head>

<body>
    <header class="header">
        <div class="header-left-side">
            <a href="#">
                <img src="./images/logo.jpg"  alt="Logo Netflix" class="header-logo">
            </a>
            <ul class="options-header">
                <a href="#">
                    <li class="text">Início</li>
                </a>

                <a href="#">
                    <li class="text">Séries</li>
                </a>

                <a href="#">
                    <li class="text">Filmes</li>
                </a>

                <a href="#">
                    <li class="text">Minha lista</li>
                </a>

            </ul>
        </div>

        <div class="header-right-side"> 
                <button>
                    <i class="bi bi-search icons"></i>
                </button>

                <button>
                    <i class="bi bi-bell-fill icons"></i>
                </button>

            <button class="header-user-icon">
                <img src="./images/user-icon.jpg" alt="ícone" class="header-user-icon" >
                <i class="bi bi-caret-down-fill" style="font-size: 15px; color: white;"></i>
            </button>

        </div>
    </header>

    <main class="container">
        <section class="section-main-content">
            <img src="./images/banner-home.png" class="banner-home" alt="banner">
            
            <div class="section-main-content-buttons">
                <button class="btn-primary btn">
                    <i class="bi bi-play-fill"></i>
                    Assistir   
                </button>
                <button class="btn-secondary btn"><i class="bi bi-plus-lg"></i> Minha lista </button>
            </div>
        </section>

        <section>
            <h3 style="padding-left: 48px;">Filmes em destaque</h3>
            <div style="display: flex; gap: 15px;" class="cards-sections">
                
                <div>
                    <h4 class="card-title-sections">Steel Ball Run</h4>
                    <a href="#"><img src="./images/movie_steelballrun.png" class="cards" alt=""></a>
                </div>

                <div>
                    <h4 class="card-title-sections">The Walking Dead</h4>
                    <a href=""><img src="./images/movie_TWD.png" class="cards" alt=""></a>
                </div>
                
                <div>
                    <h4 class="card-title-sections">Breaking bad</h4>
                    <a href="#"><img src="./images/movie_breaking-bad.png" class="cards" alt=""></a>
                </div>

                <div>
                    <h4 class="card-title-sections">The last of us</h4>
                    <a href="#"><img src="./images/movie_the-last-of-us.png" class="cards" alt=""></a>
                </div>
                <div>
                    <h4 class="card-title-sections">Inception</h4>
                    <a href="#"><img src="./images/movie_inception.png" class="cards" alt="Inception"></a>
                </div>

                <div>
                    <h4 class="card-title-sections">Interstellar</h4>
                    <a href="#"><img src="./images/movie_interstellar.png" class="cards" alt=""></a>
                </div>

                <div>
                    <h4 class="card-title-sections">O poderoso chefão</h4>
                    <a href="#"><img src="./images/movie_poderoso-chefao.png" class="cards" alt=""></a>
                </div>

                <div>
                    <h4 class="card-title-sections">John wick</h4>
                    <a href="#"><img src="./images/movie_john-wick.png" class="cards" alt=""></a>
                </div>

                <div>
                    <h4 class="card-title-sections">Wandinha</h4>
                    <a href="#"><img src="./images/movie_wandinha.png" class="cards" alt=""></a>
                </div>


            </div>
        </section>
    </main>
</body>
</html>
